<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload Form</title>
</head>
<body>
<form action="/checkScreenshot" method="POST" enctype="multipart/form-data">
    <label for="image">Select an image:</label>
    <input type="file" id="image" name="image" accept="image/*" required>
    <label>
        Check 2
        <input type="checkbox" name="check2" value="true">
    </label>
    <label>
        Crop:
        <input type="text" name="crop" id="crop">
    </label>
    <label>
        Table index for crop:
        <input type="text" name="tableIndex" id="tableIndex">
    </label>
    <br><br>
    <button type="submit">Submit</button>
</form>
</body>
</html>
